name: Roadline passive-startup regression tests
on:
  push:
    paths:
      - 'selfdrive/car/card.py'
      - 'tools/roadline/apply_passive_startup.py'
      - 'tools/roadline/tests/test_passive_startup.py'
      - 'tools/roadline/tests/test_apply_passive_startup.py'
      - '.github/workflows/roadline-passive-startup.yml'
  pull_request:
    paths:
      - 'selfdrive/car/card.py'
      - 'tools/roadline/apply_passive_startup.py'
      - 'tools/roadline/tests/test_passive_startup.py'
      - 'tools/roadline/tests/test_apply_passive_startup.py'
      - '.github/workflows/roadline-passive-startup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  passive-startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install pytest==8.4.2 pycapnp==2.1.0
      - name: Test startup and file transactions without device services
        run: |
          PYTHONPATH="$PWD" python -m pytest -c /dev/null --confcutdir=tools/roadline/tests \
            tools/roadline/tests/test_passive_startup.py \
            tools/roadline/tests/test_apply_passive_startup.py -q
