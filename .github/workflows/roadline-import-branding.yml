name: One-time Roadline branding source upload
on:
  push:
    branches: [roadline-branding-upload]
    paths:
      - 'tools/roadline/branding_import/**'
      - '.github/workflows/roadline-import-branding.yml'
permissions:
  contents: write
concurrency:
  group: roadline-branding-source-import
  cancel-in-progress: false
jobs:
  import-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
          lfs: false
          ref: ${{ github.sha }}
      - name: Import verified source changes into draft branch only
        run: python3 tools/roadline/branding_import/import_source.py
