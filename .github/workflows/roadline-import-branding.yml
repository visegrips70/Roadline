name: One-time Roadline branding source upload
on:
  push:
    branches: [roadline-branding-upload]
    paths:
      - 'tools/roadline/branding_import/**'
      - '.github/workflows/roadline-import-branding.yml'
permissions:
  contents: write
concurrency:
  group: roadline-branding-source-import
  cancel-in-progress: false
jobs:
  import-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
          lfs: false
          ref: ${{ github.sha }}
      - name: Import verified source changes into draft branch only
        run: |
          python3 - <<'PY'
          import hashlib
          import importlib.util
          from pathlib import Path
          import subprocess
          import sys
          spec = importlib.util.spec_from_file_location('branding_import', 'tools/roadline/branding_import/import_source.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          path = 'selfdrive/assets/images/spinner_comma.png'
          raw = Path(path).read_bytes()
          blob = hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest()
          if blob != 'ac6b2d4e1faa58dbf310db257ecbff425adcdc66':
            raise SystemExit('Legacy spinner differs from the inspected pinned Git blob.')
          module.OLD_IMAGES[path] = hashlib.sha256(raw).hexdigest()
          try:
            module.main()
          except subprocess.CalledProcessError as exc:
            print(exc.stdout or '', file=sys.stderr)
            print(exc.stderr or '', file=sys.stderr)
            raise
          PY
