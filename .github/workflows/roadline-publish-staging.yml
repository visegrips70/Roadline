name: Publish reviewed Roadline installation test
on:
  push:
    branches: [roadline-staging-publication]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roadline-staging-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'visegrips70/Roadline' && github.ref == 'refs/heads/roadline-staging-publication'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          path: publication
          lfs: false
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 2fbfa0c654230ead83596e2f6a474f8a8692f464
          path: source
          submodules: recursive
          lfs: false
          persist-credentials: false
      - name: Materialize the pinned public source assets
        working-directory: source
        run: |
          git lfs pull
          git submodule foreach --recursive 'git lfs pull'
      - name: Test assembly and publication checks
        run: |
          python3 -m unittest discover -s publication/tools/roadline -p test_publish_staging.py -v
          python3 -m unittest discover -s publication/tools/roadline -p test_download_release.py -v
          python3 -m unittest discover -s publication/tools/roadline -p test_verify_install_url.py -v
      - name: Reassemble, verify, publish, and check anonymous downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 publication/tools/roadline/publish_staging.py source publication/inputs "$RUNNER_TEMP/roadline-staging" --publish
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Roadline-staging-publication-${{ github.sha }}
          path: |
            ${{ runner.temp }}/roadline-staging/report.json
            ${{ runner.temp }}/roadline-staging/publication.json
          if-no-files-found: warn
